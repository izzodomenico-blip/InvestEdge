name: Daily Alert

# ALERT CLOUD DISABILITATO (2026-07-07, scelta utente).
# Motivo: il run cloud gira SENZA il portafoglio reale (cloud_daily.py, reset=False,
# DB effimero). Risultato: consigliava di comprare titoli gia posseduti (KO, AAPL) e
# non avvisava MAI di vendere le posizioni, perche il ramo SELL/REDUCE scatta solo sui
# titoli posseduti. L'alert affidabile e quello LOCALE (attivita pianificata Windows
# 08:30 -> send_daily_alert.py, che conosce il portafoglio e avvisa dei SELL).
#
# Per RIATTIVARE il cloud: decommenta il blocco 'schedule' qui sotto — idealmente solo
# dopo aver reso cloud_daily.py consapevole del portafoglio, altrimenti tornano i consigli
# fuorvianti. Il lancio manuale (workflow_dispatch) resta disponibile ma invia lo stesso
# messaggio cieco sul portafoglio: usalo solo per un test.
#
# Orario originale: 06:30 UTC = circa 08:30 in Italia (ora legale) / 07:30 (ora solare).

on:
  # schedule:
  #   - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  send-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run daily alert
        run: python scripts/cloud_daily.py
        env:
          ENABLE_ALERTS: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_REAL_DATA: ${{ secrets.ENABLE_REAL_DATA || 'true' }}
          ENABLE_REAL_NEWS: ${{ secrets.ENABLE_REAL_NEWS || 'true' }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
